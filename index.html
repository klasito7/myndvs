<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#101217">
<title>Myndvs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand" id="brand"><b>Myndvs</b><span id="topDate"></span></div>
  <div class="search" id="searchBox" hidden><input id="searchIn" type="search" placeholder="Buscar en todo…" autocomplete="off"></div>
  <button class="ib" id="syncBtn" data-a="sync" aria-label="Sincronizar"><i class="dot" id="syncDot"></i></button>
  <button class="ib" data-a="search" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <button class="ib" data-a="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
</header>

<main id="view" tabindex="-1"></main>

<form class="cap" id="cap" autocomplete="off">
  <button type="button" class="cap-mode" id="capMode" data-a="capmode">Nota</button>
  <input id="capIn" enterkeyhint="done" placeholder="¿Qué tenés en mente?">
  <button type="button" class="ib" data-a="rec" aria-label="Grabar audio"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
  <button type="button" class="ib" data-a="foto" aria-label="Agregar imagen"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6l1.5-2.5h4L15.5 6"/></svg></button>
  <button type="button" class="ib" data-a="dibu" aria-label="Dibujar"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M13.5 6.5l4 4"/></svg></button>
</form>

<nav class="tabs" id="tabs">
  <button data-tab="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><span>Hoy</span></button>
  <button data-tab="notas"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14.5 3v4.5H19M9 12h7M9 16h5"/></svg><span>Notas</span></button>
  <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendario</span></button>
  <button data-tab="diario"><svg viewBox="0 0 24 24"><path d="M6 3.5h11a2 2 0 0 1 2 2v15H8a2 2 0 0 1-2-2z"/><path d="M6 18.5a2 2 0 0 1 2-2h11M10 8h5M10 11.5h3"/></svg><span>Diario</span></button>
  <button data-tab="tareas"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l3 3 5.5-6.5"/></svg><span>Tareas</span></button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden multiple>
<input type="file" id="diaryIn" accept=".txt,.md,.markdown,.json,.csv,text/*,application/json" hidden multiple>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script src="js/parse.js"></script>
<script src="js/app.js"></script>
<script src="js/diario.js"></script>
<script src="js/tour.js"></script>
</body>
</html>
